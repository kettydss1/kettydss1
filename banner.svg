<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kethellyn Soares — Economics × Technology</title>
  <desc id="desc">Banner do perfil GitHub de Kethellyn Soares: analista de implantação em GovTech, unindo economia, dados e tecnologia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1726"/>
      <stop offset="0.55" stop-color="#0F2237"/>
      <stop offset="1" stop-color="#152C45"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8864A"/>
      <stop offset="0.5" stop-color="#D9BE84"/>
      <stop offset="1" stop-color="#A8864A"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9BE84" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D9BE84" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.45">
      <stop offset="0" stop-color="#2A4A6B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A4A6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- moldura interna -->
    <rect x="20" y="20" width="1160" height="280" rx="12" fill="none" stroke="#D9BE84" stroke-opacity="0.14"/>

    <!-- texto -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <rect x="72" y="80" width="6" height="6" fill="#D9BE84" transform="rotate(45 75 83)"/>
      <text x="92" y="88" fill="#D9BE84" font-size="13" font-weight="600" letter-spacing="4">ECONOMICS · DATA · TECHNOLOGY</text>
      <text x="70" y="152" fill="#F3EEE3" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="0.5">Kethellyn Soares</text>
      <rect x="72" y="174" width="72" height="2" fill="url(#gold)"/>
      <text x="72" y="212" fill="#B7C4D3" font-size="20" letter-spacing="0.3">Implementation Analyst · GovTech &amp; Public Sector</text>
      <text x="72" y="248" fill="#8FA3B8" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15">
        <tspan fill="#D9BE84">{</tspan> business analysis + code <tspan fill="#D9BE84">}</tspan>  →  data-driven decisions</text>
    </g>

